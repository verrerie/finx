version: 2
updates:
  # Enable version updates for pnpm (Node.js) dependencies
  - package-ecosystem: "pnpm"
    # Look for package.json and pnpm-lock.yaml files in the root directory
    directory: "/"
    # Check for updates daily (weekdays)
    schedule:
      interval: "daily"
    # Optional: Group all npm/pnpm dependency updates into a single PR
    # groups:
    #   pnpm-dependencies:
    #     patterns:
    #       - "*"

  # Enable version updates for GitHub Actions workflows
  - package-ecosystem: "github-actions"
    # Look for workflow files in the .github/workflows directory (or root if they are there)
    directory: "/"
    # Check for updates weekly
    schedule:
      interval: "weekly"
